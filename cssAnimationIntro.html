<!doctype html>
<html>
<head>
  <style>
    * {
      box-sizing: border-box;
    }

    div {
      width: 100px;
      height: 100px;
      margin: 15px;
      border: 1px solid black;
      position: relative;
    }
    
  @keyframes redToYellow {
    from {background-color: red;}
    to {background-color: yellow;}
  }

  /* Standard syntax*/
  body {
    width: 100%;
    height: 100%;
    background-color: red;
    animation-name: redToYellow;
    animation-duration: 4s;
    /*
    animation-direction values are
    normal - play forward and resets to start over
    reverse - plays backgwards and resets to ends tate
    alternate - reverses direction each cycle, first is forward
    alternate-reverse - reverses direction each cycle, first is backwards
    */
    animation-direction: alternate-reverse;
    animation-iteration-count: infinite;
    
  </style>
</head>
</html>
